workstations:
  # No `use:` -> runs the entire registry, in file order (unchanged behavior).
  - name: "glamdring"
  # NixOS box: selects a subset by name, omitting NixDaemon and HomebrewBundle.
  - name: "nixbox"
    use: [home-dotfiles, home-manager, bitwarden]
properties:
  - name: home-dotfiles
    type: GitHomeDir
    params:
      gitDir: .git-dir
      remoteUrl: "git@github.com:joelmccracken/dotfiles.git"
      branch: master
      # homeDir: "~/temp_home"
  - name: nix-daemon
    type: NixDaemon
    params:
      interactive: False
      nixConf: |
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
        substituters = https://cache.nixos.org https://cache.iog.io
        experimental-features = nix-command flakes
        trusted-users = root joelmccracken runner
        build-users-group = nixbld
  - name: home-manager
    type: HomeManager
    params:
      dir: "~/.config/funstation/nix"
  - name: brew-bundle
    type: HomebrewBundle
    params:
      brewfile: "~/.config/funstation/Brewfile"
  - name: bitwarden
    type: BitwardenSecrets
    params:
      syncIntervalDays: 7
