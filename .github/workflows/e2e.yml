name: E2E

on:
  push:
    branches: [master]
  # PRs run only when labeled `e2e` (via `if:` on jobs below)
  # `labeled` type means applying the label triggers a run without a re-push
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  build:
    # Always on master/dispatch; on PRs only when the `e2e` label is present.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/build.yml

  e2e:
    name: E2E (${{ matrix.ws }})
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: [build]
    runs-on: ${{ matrix.os }}
    # Holds the BW_* secrets for the dedicated CI Bitwarden account.
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-linux
            ws: ci-linux
          - os: macos-14
            triple: aarch64-darwin
            ws: ci-macos
    steps:
      - uses: actions/checkout@v4

      - name: Download fun binary
        uses: actions/download-artifact@v4
        with:
          name: funstation-${{ matrix.triple }}

      - name: Make fun executable
        run: |
          cp funstation-${{ matrix.triple }} fun
          chmod +x fun
          ./fun --help

      - name: Generate hermetic GitHomeDir source repo + fixtures
        run: bash test/ci/setup-src-repo.sh

      # BitwardenSecrets expects `bw` on PATH; it doesn't install it.
      - name: Install Bitwarden CLI
        run: npm install -g @bitwarden/cli

      # BitwardenSecrets reads its credentials from ~/secrets/bw_*.
      - name: Write Bitwarden credentials
        env:
          BW_MASTER_PASS: ${{ secrets.BW_MASTER_PASS }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
        run: |
          for v in BW_MASTER_PASS BW_CLIENT_ID BW_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not set (secrets are unavailable to fork PRs)"
              exit 1
            fi
          done
          umask 077
          mkdir -p ~/secrets
          printf '%s' "$BW_CLIENT_ID"     > ~/secrets/bw_client_id
          printf '%s' "$BW_CLIENT_SECRET" > ~/secrets/bw_client_secret
          printf '%s' "$BW_MASTER_PASS"   > ~/secrets/bw_master_pass

      # pipefail - ensure fun failure fails step
      - name: Bootstrap (first run)
        run: |
          set -o pipefail
          ./fun --config test/ci/config.yml --workstation ${{ matrix.ws }} --verbose bootstrap 2>&1 | tee run1.log

      - name: Verify system state
        run: bash test/ci/verify.sh

      - name: Bootstrap (second run, idempotency)
        run: |
          set -o pipefail
          ./fun --config test/ci/config.yml --workstation ${{ matrix.ws }} --verbose bootstrap 2>&1 | tee run2.log

      - name: Assert idempotency (no fixes applied on second run)
        run: |
          if grep -q "Invalid, applying fix" run2.log; then
            echo "ERROR: second bootstrap applied fixes; not idempotent:"
            grep -n "Invalid, applying fix" run2.log || true
            exit 1
          fi
          echo "Idempotent: no fixes applied on second run."

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.ws }}
          path: |
            run1.log
            run2.log
