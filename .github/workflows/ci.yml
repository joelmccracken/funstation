name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The nix dev shell's closure is large; free up room as build.yml does.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - uses: DeterminateSystems/nix-installer-action@v14

      - name: Build
        run: nix develop --accept-flake-config -c cabal build all

      - name: Test
        run: nix develop --accept-flake-config -c cabal test all
